name: Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish CopperIPTV/CopperIPTV.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopperIPTV-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          retention-days: 30

      - name: Install Inno Setup
        if: matrix.rid == 'win-x64'
        run: choco install innosetup -y

      - name: Build Windows installer
        if: matrix.rid == 'win-x64'
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\copperiptv.iss

      - name: Upload installer
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: CopperIPTV-Installer
          path: installer/*.exe
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create platform zips
        run: |
          cd artifacts
          for dir in CopperIPTV-*/; do
            name="${dir%/}"
            if [ "$name" != "CopperIPTV-Installer" ]; then
              cd "$name"
              zip -r "../${name}.zip" . -x "*/\.*"
              cd ..
            fi
          done

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/*.zip release/ 2>/dev/null || true
          cp artifacts/CopperIPTV-Installer/*.exe release/ 2>/dev/null || true
          ls -lh release/

      - name: Create release with zips + installer
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
